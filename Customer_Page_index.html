<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snacks Point – Online Food Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 sidebar p-3">
        <div class="logo mb-4">Snacks<br />Point</div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-secondary" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#" onclick="showOrders()">Your Orders</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#" onclick="showWishlist()">Wishlists</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#" onclick="showCart()">Cart</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#">Contact</a></li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="col-md-7 p-4">
        <div class="d-flex flex-wrap gap-2 mb-4 top-bar">
          <input type="text" id="searchInput" class="form-control w-auto" placeholder="Search..." onkeyup="searchFood()" />
          <button class="btn btn-outline-danger"><i class="bi bi-tag"></i> Offers</button>
          <button class="btn btn-outline-danger" onclick="showCart()">
            <i class="bi bi-cart"></i> <span id="cartCount">0</span> Items
          </button>
          <button class="btn btn-outline-danger"><i class="bi bi-geo-alt"></i> Address</button>
        </div>

        <h2 class="text-warning mb-4" id="categoryTitle">Burger</h2>
        <div class="row" id="foodGrid"></div>
      </div>

      <!-- Categories -->
      <div class="col-md-3 p-4">
        <h4 class="text-danger">Go For Hunt</h4>
        <hr />
        <div class="list-group category-list">
          <div class="list-group-item" onclick="filterCategory('All')">🍽️ All</div>
          <div class="list-group-item" onclick="filterCategory('Burger')">🍔 Burger</div>
          <div class="list-group-item" onclick="filterCategory('Burrito')">🌯 Burrito</div>
          <div class="list-group-item" onclick="filterCategory('Desserts')">🍰 Desserts</div>
          <div class="list-group-item" onclick="filterCategory('Donuts')">🍩 Donuts</div>
          <div class="list-group-item" onclick="filterCategory('Pizza')">🍕 Pizza</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Your Cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartItems"></div>
        <div class="modal-footer">
          <button class="btn btn-success" onclick="checkout()">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
