<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container-fluid vh-100">
    <div class="row h-100">
      <div class="col-md-6 d-flex align-items-center justify-content-center">
        <form id="loginForm" class="w-75">
          <h2 class="text-primary">Login</h2>
          <p class="fs-4">Welcome back!</p>
          <p class="text-muted">Enter your email address and password to access admin panel.</p>

          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" value="admin@gmail.com" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" value="admin123" required />
          </div>

          <button type="submit" class="btn btn-outline-secondary">Login</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </form>
      </div>

      <div class="col-md-6 p-0" style="background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200') center/cover;">
        <div class="h-100 d-flex flex-column justify-content-end text-white p-5 bg-dark bg-opacity-50">
          <h2>This beautiful theme yours!</h2>
          <p>"Best investment i made for a long time. Can only recommend it for other users."</p>
          <p><strong>- Admin User</strong></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;

      if (email === "admin@gmail.com" && pass === "admin123") {
        alert("successfully login!");
        window.location.href = "admin-dashboard.html";
      } else {
        alert("Invalid credentials. Use admin@gmail.com / admin123");
      }
    });
  </script>
</body>
</html>
